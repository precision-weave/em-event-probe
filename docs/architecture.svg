<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 500" width="1110" height="500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/></marker>
    <style>
      .box { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
      .store { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
      .title { font-size: 14px; font-weight: 600; fill: #111827; }
      .sub { font-size: 12px; fill: #4b5563; }
      .label { font-size: 12px; fill: #374151; stroke: #ffffff; stroke-width: 4px; paint-order: stroke; stroke-linejoin: round; }
      .group { font-size: 13px; font-weight: 600; fill: #374151; letter-spacing: .04em; }
      .line { fill: none; stroke: #4b5563; stroke-width: 1.5; }
    </style>
  </defs>
  <rect x="0" y="0" width="1110" height="500" fill="#ffffff"/>

  <!-- containers -->
  <rect x="320" y="40" width="400" height="430" rx="14" fill="#eef6f4" stroke="#7fb8ab" stroke-width="1.5"/>
  <text class="group" x="336" y="64">APP.MJS (NODE)</text>
  <rect x="780" y="40" width="300" height="430" rx="14" fill="#f5f0fb" stroke="#b9a3d6" stroke-width="1.5"/>
  <text class="group" x="796" y="64">EVENTMODELERS PLATFORM</text>

  <!-- viewer -->
  <rect class="box" x="40" y="70" width="210" height="80" rx="10"/>
  <text class="title" x="56" y="100">Viewer</text>
  <text class="sub" x="56" y="120">index.html in your browser</text>
  <text class="sub" x="56" y="138">timeline, scenarios, playback</text>

  <!-- app -->
  <rect class="box" x="340" y="80" width="360" height="50" rx="10"/>
  <text class="title" x="356" y="102">HTTP server</text>
  <text class="sub" x="356" y="120">/stream, /scenario, /ack, /pw/*.css</text>

  <rect class="store" x="340" y="180" width="140" height="60" rx="10"/>
  <text class="title" x="356" y="206">Recording</text>
  <text class="sub" x="356" y="224">records/*.jsonl</text>

  <rect class="box" x="540" y="180" width="160" height="60" rx="10"/>
  <text class="title" x="556" y="206">Scenario runner</text>
  <text class="sub" x="556" y="224">actions, sync waits</text>

  <rect class="box" x="540" y="295" width="160" height="60" rx="10"/>
  <text class="title" x="556" y="321">REST poller</text>
  <text class="sub" x="556" y="339">every 1 s, 5 s overlap</text>

  <rect class="box" x="540" y="385" width="160" height="60" rx="10"/>
  <text class="title" x="556" y="411">Realtime recorder</text>
  <text class="sub" x="556" y="429">3 channels</text>

  <!-- platform -->
  <rect class="box" x="800" y="80" width="125" height="50" rx="10"/>
  <text class="title" x="816" y="110">MCP server</text>
  <rect class="box" x="940" y="80" width="125" height="50" rx="10"/>
  <text class="title" x="956" y="110">REST API</text>

  <rect class="store" x="800" y="190" width="265" height="60" rx="10"/>
  <text class="title" x="816" y="216">Board event log</text>
  <text class="sub" x="816" y="234">every write, silent ones included</text>

  <rect class="box" x="800" y="300" width="265" height="60" rx="10"/>
  <text class="title" x="816" y="326">Realtime broadcast</text>
  <text class="sub" x="816" y="344">board, slice:changed, org channels</text>

  <!-- viewer and HTTP server -->
  <path class="line" d="M340 95 H252" marker-end="url(#ah)"/>
  <text class="label" x="296" y="88" text-anchor="middle">events</text>
  <path class="line" d="M250 125 H338" marker-end="url(#ah)"/>
  <text class="label" x="296" y="143" text-anchor="middle">run, ack</text>

  <!-- inside the app -->
  <path class="line" d="M620 130 V178" marker-end="url(#ah)"/>
  <text class="label" x="628" y="160">start scenario</text>
  <path class="line" d="M410 180 V132" marker-end="url(#ah)"/>
  <path class="line" d="M540 210 H482" marker-end="url(#ah)"/>
  <path class="line" d="M540 325 H450 V242" marker-end="url(#ah)"/>
  <path class="line" d="M540 415 H380 V242" marker-end="url(#ah)"/>

  <!-- writes -->
  <path class="line" d="M700 205 H760 V105 H798" marker-end="url(#ah)"/>
  <text class="label" x="766" y="160">writes</text>

  <!-- inside the platform -->
  <path class="line" d="M862 130 V188" marker-end="url(#ah)"/>
  <path class="line" d="M1002 130 V188" marker-end="url(#ah)"/>
  <path class="line" d="M932 250 V298" marker-end="url(#ah)"/>
  <text class="label" x="940" y="280">non-silent writes</text>

  <!-- reads -->
  <path class="line" d="M800 225 H740 V325 H702" marker-end="url(#ah)"/>
  <text class="label" x="735" y="286" text-anchor="end">GET events since</text>
  <path class="line" d="M800 340 H760 V415 H702" marker-end="url(#ah)"/>
  <text class="label" x="766" y="392">broadcasts</text>
</svg>
